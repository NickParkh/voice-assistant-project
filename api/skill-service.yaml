openapi: 3.1.0
info:
  title: skill-service
  version: 1.0.0
  description: Выполнение действий в ОС Windows.
paths:
  /internal/v1/skills/{skillId}/execute:
    post:
      tags: [internal]
      summary: Выполнить навык
      parameters:
        - in: path
          name: skillId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slots: { type: object }
            example:
              slots: {}
      responses:
        '200':
          description: Команда выполнена
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [EXECUTED, REJECTED] }
        '403':
          description: Нет прав на выполнение
        '500':
          description: Ошибка операционной системы